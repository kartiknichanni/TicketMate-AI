<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | TicketMate AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #101d35;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            color: #42d6c4;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover,
        nav a.active {
            color: #42d6c4;
        }

        .container {
            max-width: 1050px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #718096;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(20, 40, 80, 0.06);
        }

        .profile-card {
            text-align: center;
            height: fit-content;
        }

        .avatar {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            background: #d9f7f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #087f72;
            margin: 0 auto 15px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-label {
            display: inline-block;
            margin: 12px 0;
            color: #087fbd;
            cursor: pointer;
            font-size: 14px;
        }

        .upload-label input {
            display: none;
        }

        .profile-card h2 {
            margin-top: 10px;
            font-size: 21px;
        }

        .profile-card p {
            color: #718096;
            margin-top: 7px;
            font-size: 14px;
            word-break: break-word;
        }

        .account-status {
            display: inline-block;
            margin-top: 18px;
            background: #e3f9ed;
            color: #16834b;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #475569;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce3ec;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #159e91;
        }

        input:disabled {
            background: #f1f4f8;
            color: #64748b;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 23px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .save-btn {
            background: #087f72;
            color: white;
        }

        .edit-btn {
            background: #e7f4ff;
            color: #087fbd;
        }

        .logout-btn {
            background: #fff0f0;
            color: #d33b3b;
            width: 100%;
            margin-top: 15px;
        }

        button:hover {
            opacity: 0.88;
        }

        .message {
            margin-top: 15px;
            color: #16834b;
            font-size: 14px;
        }

        @media(max-width: 750px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            header {
                padding: 18px 5%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">✈ TicketMate AI</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="bookings.html">My Bookings</a>
        <a href="assistant.html">AI Assistant</a>
        <a href="profile.html" class="active">Profile</a>
    </nav>
</header>

<div class="container">

    <div class="page-heading">
        <h1>My Profile</h1>
        <p>Manage your personal information and travel preferences.</p>
    </div>

    <div class="profile-layout">

        <div class="card profile-card">

            <div class="avatar" id="avatar">
                👤
            </div>

            <label class="upload-label">
                Change profile photo
                <input type="file" id="photoInput" accept="image/*">
            </label>

            <h2 id="profileName">Traveler</h2>
            <p id="profileEmail">traveler@example.com</p>

            <span class="account-status">Demo Account</span>

            <button class="logout-btn" onclick="logout()">
                Log Out
            </button>

        </div>

        <div class="card">

            <h2 class="section-title">Personal Information</h2>

            <form id="profileForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter your name" disabled>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" disabled>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" id="phone" placeholder="Enter mobile number" disabled>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="dob" disabled>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" disabled>
                            <option value="">Select gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                            <option>Prefer not to say</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Preferred Travel Mode</label>
                        <select id="travelMode" disabled>
                            <option value="">Select preference</option>
                            <option>Bus</option>
                            <option>Train</option>
                            <option>Flight</option>
                            <option>Any</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label>Address</label>
                        <textarea id="address" rows="3"
                            placeholder="Enter your address" disabled></textarea>
                    </div>

                </div>

                <div class="buttons">
                    <button type="button" class="edit-btn" id="editBtn"
                        onclick="enableEditing()">
                        Edit Profile
                    </button>

                    <button type="submit" class="save-btn" id="saveBtn"
                        style="display:none;">
                        Save Changes
                    </button>
                </div>

                <p class="message" id="message"></p>

            </form>

        </div>

    </div>

</div>

<script>
    const fields = [
        "fullName",
        "email",
        "phone",
        "dob",
        "gender",
        "travelMode",
        "address"
    ];

    // Load demo profile details from this browser.
    function loadProfile() {
        const savedProfile = JSON.parse(
            localStorage.getItem("ticketmateProfile") || "{}"
        );

        const loginEmail = localStorage.getItem("ticketmateEmail") || "";

        document.getElementById("fullName").value =
            savedProfile.fullName || "";

        document.getElementById("email").value =
            savedProfile.email || loginEmail;

        document.getElementById("phone").value =
            savedProfile.phone || "";

        document.getElementById("dob").value =
            savedProfile.dob || "";

        document.getElementById("gender").value =
            savedProfile.gender || "";

        document.getElementById("travelMode").value =
            savedProfile.travelMode || "";

        document.getElementById("address").value =
            savedProfile.address || "";

        document.getElementById("profileName").textContent =
            savedProfile.fullName || "Traveler";

        document.getElementById("profileEmail").textContent =
            savedProfile.email || loginEmail || "No email added";

        const savedPhoto = localStorage.getItem("ticketmateProfilePhoto");

        if (savedPhoto) {
            document.getElementById("avatar").innerHTML =
                `<img src="${savedPhoto}" alt="Profile photo">`;
        }
    }

    function enableEditing() {
        fields.forEach(id => {
            document.getElementById(id).disabled = false;
        });

        document.getElementById("editBtn").style.display = "none";
        document.getElementById("saveBtn").style.display = "inline-block";
    }

    document.getElementById("profileForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const profile = {};

        fields.forEach(id => {
            profile[id] = document.getElementById(id).value.trim();
            document.getElementById(id).disabled = true;
        });

        localStorage.setItem("ticketmateProfile", JSON.stringify(profile));

        document.getElementById("profileName").textContent =
            profile.fullName || "Traveler";

        document.getElementById("profileEmail").textContent =
            profile.email || "No email added";

        document.getElementById("editBtn").style.display = "inline-block";
        document.getElementById("saveBtn").style.display = "none";

        document.getElementById("message").textContent =
            "Profile saved in this browser successfully!";

    });

    document.getElementById("photoInput").addEventListener("change", function() {
        const file = this.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("Please select an image file.");
            return;
        }

        if (file.size > 1024 * 1024) {
            alert("Please select an image smaller than 1 MB.");
            return;
        }

        const reader = new FileReader();

        reader.onload = function(event) {
            document.getElementById("avatar").innerHTML =
                `<img src="${event.target.result}" alt="Profile photo">`;

            localStorage.setItem(
                "ticketmateProfilePhoto",
                event.target.result
            );
        };

        reader.readAsDataURL(file);
    });

    function logout() {
        if (confirm("Are you sure you want to log out?")) {
            localStorage.removeItem("ticketmateEmail");
            window.location.href = "login.html";
        }
    }

    loadProfile();
</script>

</body>
</html>
